name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  code-quality: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BusyBar.sln

      - name: Build
        run: dotnet build BusyBar.sln --no-restore -c Release

      # coverage.runsettings sets IncludeTestAssembly=False so the reported percentage
      # reflects the BusyBar library only, not the (trivially near-100%-covered) test project.
      - name: Test
        run: dotnet test BusyBar.sln --no-build -c Release --settings coverage.runsettings --results-directory ./TestResults

      - name: Locate coverage report
        id: coverage
        shell: bash
        run: |
          file=$(find ./TestResults -name '*.cobertura.xml' -print -quit)
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload code coverage
        uses: actions/upload-code-coverage@v1
        with:
          file: ${{ steps.coverage.outputs.file }}
          language: CSharp
          label: code-coverage/busybar
