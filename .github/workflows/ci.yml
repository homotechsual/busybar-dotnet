name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BusyBar.sln

      - name: Build
        run: dotnet build BusyBar.sln --no-restore -c Release

      - name: Test
        run: dotnet test BusyBar.sln --no-build -c Release
