name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    environment: nuget

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve package version from tag
        id: version
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore src/BusyBar/BusyBar.csproj

      - name: Pack
        run: dotnet pack src/BusyBar/BusyBar.csproj --no-restore -c Release -o ./artifacts -p:Version=${{ steps.version.outputs.version }}

      - name: Push to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-gpr:
    runs-on: ubuntu-latest
    needs: publish-nuget

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve package version from tag
        id: version
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore src/BusyBar/BusyBar.csproj

      - name: Pack
        run: dotnet pack src/BusyBar/BusyBar.csproj --no-restore -c Release -o ./artifacts -p:Version=${{ steps.version.outputs.version }}

      - name: Add GitHub Packages source
        run: dotnet nuget add source --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Push to GitHub Packages
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source github --skip-duplicate
